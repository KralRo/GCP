<!doctype html>
<html lang="cs" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aktuality – Admin</title>
  <link rel="icon" type="image/png" href="/static/images/favicon.ico">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar border-bottom">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <span class="navbar-brand mb-0">Administrace</span>
      <div class="d-flex align-items-center gap-3">
        <a class="nav-link d-inline" href="{{.AdminPath}}">Texty stránek</a>
        <form method="post" action="{{.LogoutPath}}" class="mb-0">
          <button class="btn btn-outline-primary btn-sm" type="submit">Odhlásit</button>
        </form>
      </div>
    </div>
  </nav>

  <main class="section-pad">
    <div class="container" style="max-width: 720px;">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h1 class="h4 fw-bold mb-0">Aktuality</h1>
        <a class="btn btn-primary" href="{{.NewPath}}">+ Přidat aktualitu</a>
      </div>

      {{if not .Posts}}
      <p class="text-muted">Zatím žádné aktuality.</p>
      {{end}}

      {{range .Posts}}
      <div class="card card-soft rounded-4 mb-3">
        <div class="card-body p-4 d-flex justify-content-between align-items-start flex-wrap gap-3">
          <div>
            <div class="text-muted small mb-1">{{.Date}}</div>
            <div class="fw-bold">{{.Title}}</div>
          </div>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-primary btn-sm" href="{{.EditPath}}">Upravit</a>
            <form method="post" action="{{.DeletePath}}" onsubmit="return confirm('Opravdu smazat tuto aktualitu?')" class="mb-0">
              <button class="btn btn-outline-primary btn-sm" type="submit">Smazat</button>
            </form>
          </div>
        </div>
      </div>
      {{end}}
    </div>
  </main>
</body>
</html>
