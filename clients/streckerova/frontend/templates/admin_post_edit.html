<!doctype html>
<html lang="cs" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{if .IsNew}}Nová aktualita{{else}}Upravit aktualitu{{end}} – Admin</title>
  <link rel="icon" type="image/png" href="/static/images/favicon.ico">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar border-bottom">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <span class="navbar-brand mb-0">Administrace</span>
      <a class="nav-link d-inline" href="{{.PostsPath}}">← Zpět na seznam</a>
    </div>
  </nav>

  <main class="section-pad">
    <div class="container" style="max-width: 720px;">
      <h1 class="h4 fw-bold mb-4">{{if .IsNew}}Nová aktualita{{else}}Upravit aktualitu{{end}}</h1>

      <div class="card card-soft rounded-4">
        <div class="card-body p-4">
          <form method="post">
            <div class="mb-3">
              <label class="form-label">Datum</label>
              <input class="form-control" type="text" name="date" value="{{.Date}}" placeholder="např. 2. 9. 2026" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Nadpis</label>
              <input class="form-control" type="text" name="title" value="{{.Title}}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Text</label>
              <textarea class="form-control" name="body" rows="10">{{.Body}}</textarea>
            </div>
            <button class="btn btn-primary" type="submit">Uložit</button>
          </form>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
