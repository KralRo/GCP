<!doctype html>
<html lang="cs" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}} – Admin</title>
  <link rel="icon" type="image/png" href="/static/images/favicon.ico">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar border-bottom">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <span class="navbar-brand mb-0">Administrace</span>
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <a class="nav-link d-inline" href="{{.HomePath}}">Domů</a>
        <a class="nav-link d-inline" href="{{.AboutPath}}">O mně</a>
        <a class="nav-link d-inline" href="{{.ServicesPath}}">Služby</a>
        <a class="nav-link d-inline" href="{{.PostsPath}}">Aktuality</a>
        <form method="post" action="{{.LogoutPath}}" class="mb-0">
          <button class="btn btn-outline-primary btn-sm" type="submit">Odhlásit</button>
        </form>
      </div>
    </div>
  </nav>

  <main class="section-pad">
    <div class="container" style="max-width: 760px;">
      <h1 class="h4 fw-bold mb-4">{{.Title}}</h1>

      {{if .Saved}}<p class="success">Uloženo.</p>{{end}}

      <form method="post">
        {{range .Sections}}
        <h2 class="h6 text-uppercase text-muted mt-4 mb-3">{{.Heading}}</h2>
        <div class="card card-soft rounded-4 mb-4">
          <div class="card-body p-4">
            {{range .Fields}}
            <div class="mb-3">
              <label class="form-label">{{.Label}}</label>
              {{if eq .Kind "line"}}
              <input class="form-control" type="text" name="{{.Key}}" value="{{.Value}}">
              {{else}}
              <textarea class="form-control" name="{{.Key}}" rows="{{if eq .Kind "list"}}4{{else}}5{{end}}">{{.Value}}</textarea>
              {{if eq .Kind "list"}}<div class="form-hint mt-1">Každý řádek je jedna položka seznamu.</div>{{end}}
              {{end}}
            </div>
            {{end}}
          </div>
        </div>
        {{end}}
        <button class="btn btn-primary" type="submit">Uložit</button>
      </form>
    </div>
  </main>
</body>
</html>
