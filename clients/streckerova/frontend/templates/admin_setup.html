<!doctype html>
<html lang="cs" data-bs-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vytvořit účet – Admin</title>
  <link rel="icon" type="image/png" href="/static/images/favicon.ico">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card card-soft rounded-4" style="width: 100%; max-width: 380px;">
      <div class="card-body p-4">
        <h1 class="h4 fw-bold mb-2">První spuštění</h1>
        <p class="text-muted mb-4">Vytvoř si účet pro správu obsahu webu.</p>
        <form method="post" action="{{.SetupPath}}">
          <div class="mb-3">
            <label class="form-label">Jméno</label>
            <input class="form-control" type="text" name="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Heslo</label>
            <input class="form-control" type="password" name="password" required minlength="8">
            <div class="form-hint mt-1">Alespoň 8 znaků.</div>
          </div>
          <button class="btn btn-primary w-100" type="submit">Vytvořit účet</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
