<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Nastavit administrátora</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>První spuštění – vytvoř admin účet</h1>
  <form method="post" action="{{.SetupPath}}">
    <label>Jméno <input type="text" name="username" required autofocus></label>
    <label>Heslo <input type="password" name="password" required minlength="8"></label>
    <button type="submit">Vytvořit účet</button>
  </form>
</body>
</html>
