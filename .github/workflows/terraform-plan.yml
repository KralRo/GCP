name: Terraform Plan

on:
  pull_request:
    paths:
      - 'clients/*/infra/**'
      - 'clients/*/backend/**'
      - 'clients/*/frontend/**'
      - 'modules/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.detect.outputs.clients }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -q '^modules/'; then
            clients=$(ls -d clients/*/ | xargs -n1 basename | grep -v '^_template$' | jq -R -s -c 'split("\n")[:-1]')
          else
            clients=$(echo "$changed" | grep -oE '^clients/[^/]+' | sed 's#clients/##' | grep -v '^_template$' | sort -u | jq -R -s -c 'split("\n")[:-1]')
          fi
          echo "clients=$clients" >> "$GITHUB_OUTPUT"

  plan:
    needs: detect-changes
    if: needs.detect-changes.outputs.clients != '[]'
    runs-on: ubuntu-latest
    env:
      REGION: europe-west1
    strategy:
      matrix:
        client: ${{ fromJson(needs.detect-changes.outputs.clients) }}
    steps:
      - uses: actions/checkout@v4

      # Requires WIF_PROVIDER / WIF_SERVICE_ACCOUNT repo variables to be set up
      # once the bootstrap "infra" project and its Workload Identity Federation pool exist.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: clients/${{ matrix.client }}/infra
        run: terraform init -backend-config=backend.hcl

      # var.image has no value in prod.tfvars (terraform-apply.yml always passes
      # it explicitly at apply time, built or reused). Without an override here,
      # plan would fall back to the module's placeholder default and show every
      # PR proposing to replace the live image with it. Resolve what's actually
      # deployed instead so plan reflects reality; a client with no deployment
      # yet just falls through to the placeholder default, which is correct too.
      - name: Resolve currently deployed image
        id: current_image
        run: |
          image=$(gcloud run services describe "svc-prod" \
            --project="rk-${{ matrix.client }}" --region="${REGION}" \
            --format='value(spec.template.spec.containers[0].image)' 2>/dev/null || true)
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan
        working-directory: clients/${{ matrix.client }}/infra
        run: |
          if [ -n "${{ steps.current_image.outputs.image }}" ]; then
            terraform plan -var-file=prod.tfvars -var="image=${{ steps.current_image.outputs.image }}"
          else
            terraform plan -var-file=prod.tfvars
          fi
